<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compare the Sound</title>
<style>
:root{--bg:#0B0B14;--panel:#15141F;--fg:#EEEBF5;--muted:#A39DB3;--line:#2A2838;--accent:#D5FC31;--accent-ink:#2B3300;--scene:#B680F0;--seg:#6FD39C;--alt:#F29E38}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F5F1;--panel:#FFFFFF;--fg:#16141C;--muted:#5F5A6B;--line:#E3E0EA;--scene:#7B27C9;--seg:#1F7A4D;--alt:#C86A0C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Helvetica Neue",sans-serif}
main{max-width:1240px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 8px;max-width:80ch}
.players{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.tag{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
video{width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;display:block;margin-top:8px}
.tl{position:relative;margin:18px 0 6px;padding-left:96px;overflow:hidden}
.row{position:relative;height:26px;margin-bottom:6px;border-radius:6px;background:var(--line)}
.rl{position:absolute;left:-96px;width:90px;top:5px;font:600 11px ui-monospace,Menlo,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 6px;font-size:11px;white-space:nowrap;overflow:hidden;border-right:1px solid var(--bg)}
.scenes .seg{background:color-mix(in srgb,var(--scene) 22%,transparent)}
.music .seg{background:color-mix(in srgb,var(--seg) 24%,transparent)}
.music .seg.other{background:color-mix(in srgb,var(--alt) 40%,transparent)}
.head{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none}
.moments{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.moments button{font:500 13px system-ui,sans-serif;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.moments button:hover{border-color:var(--accent)}
.moments b{font-family:ui-monospace,Menlo,monospace;margin-right:6px}
@media (max-width:600px){.tl{padding-left:0}.rl{position:static;display:block;margin-bottom:2px}.row{margin-bottom:22px}}
</style></head><body><main>
<h1 id="title"></h1>
<p class="lede" id="lede"></p>
<div class="tl" id="tl"></div>
<div class="moments" id="moments"></div>
<div class="players" id="players"></div>
</main>
<script>
const D = /*DATA*/null;
const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
const pct = (t) => (100 * t / D.len).toFixed(3) + "%";
document.getElementById("title").textContent = `${D.film}: ${D.variants.map((v) => v.label).join(" vs ")}`;
document.getElementById("lede").textContent = `The same picture under each variant's sound (${D.name}). Play one; the others pause. A moment jumps every player there, 2 s ahead of it. The music rows show each variant's edit: which song and which seconds of it play where.`;
const seg = (cls, a, b, text, title) => `<div class="seg ${cls}" style="left:${pct(a)};width:${pct(b - a)}" title="${title ?? text}">${text}</div>`;
let rows = `<div class="row scenes"><span class="rl">scenes</span>${D.scenes.map((s) => seg("", s.start, s.end, s.id, `${s.id} ${fmt(s.start)}–${fmt(s.end)}`)).join("")}<div class="head"></div></div>`;
for (const v of D.variants) {
  let t = 0, first = v.music.tracks?.[0] ?? v.music.key;
  const segs = (v.music.segments ?? [[0, D.len]]).map(([a, b], i) => { const k = v.music.tracks?.[i] ?? v.music.key, s = seg(k === first ? "" : "other", t, t + (b - a), `${k} ${a.toFixed(1)}–${b.toFixed(1)}`); t += b - a; return s; }).join("");
  rows += `<div class="row music"><span class="rl">${v.label}</span>${segs}<div class="head"></div></div>`;
}
document.getElementById("tl").innerHTML = rows;
document.getElementById("players").innerHTML = D.variants.map((v) => `<div class="card"><span class="tag">${v.label}</span><video src="${v.file}#t=0.05" controls preload="metadata" playsinline></video></div>`).join("");
document.getElementById("moments").innerHTML = (D.moments ?? []).map((m) => `<button data-t="${m.t}"><b>${fmt(m.t)}</b>${m.what ?? ""}</button>`).join("");
const vids = () => [...document.querySelectorAll("video")];
document.getElementById("moments").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; for (const v of vids()) { v.pause(); v.currentTime = Math.max(0, +b.dataset.t - 2); } });
document.addEventListener("play", (e) => { for (const v of vids()) if (v !== e.target) v.pause(); }, true);
const heads = () => document.querySelectorAll(".head");
document.addEventListener("timeupdate", (e) => { for (const h of heads()) h.style.left = pct(e.target.currentTime); }, true);
</script></body></html>
