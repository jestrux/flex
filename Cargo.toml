[workspace]
resolver = "2"
members = ["crates/flex-core", "crates/flex-ffi", "crates/flex-cli", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
flex-core = { path = "crates/flex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
uniffi = "0.32"
resvg = "0.45"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rayon = "1"
notify = "8"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The painter is the hot path: keep it fast in debug builds too (the app's Debug build uses them).
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.flex-core]
opt-level = 2
